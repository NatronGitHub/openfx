name: Extended builds

# Variants that must not run on every pull request (policy for all
# Natron-related repos): CMake on Linux/macOS, MSVC, debug builds, extension
# flags OFF, C++20 and C++23, the Makefile builds, and the ofxh module installed with pip on
# macOS (MacPorts Python; with the ofxhost tests on both backends). Runs weekly (Saturday
# 03:17 UTC) and on demand. Never skipped, even if master didn't change: every job installs
# rolling toolchains (MacPorts, apt and MSVC on *-latest images), so a week without commits
# still tests toolchain drift.

on:
  schedule:
    - cron: '17 3 * * 6' # weekly, Saturday at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  # for every step: pytest reads PYTEST_ADDOPTS, and only the tests read OFXH_REQUIRE (1: a missing
  # ofxh module, plug-in or hostDemo fails the tests instead of skipping them)
  PYTEST_ADDOPTS: -q -rs -p no:cacheprovider -o faulthandler_timeout=300
  PYTHONFAULTHANDLER: '1'
  OFXH_REQUIRE: '1'

jobs:
  # CMake, with each platform's default compiler (MSVC on Windows). The MSYS2 build runs on
  # every pull request (build.yml).
  cmake:
    name: CMake (${{ matrix.os }}, ${{ matrix.config }}, extensions ${{ matrix.extensions }}${{ matrix.cxx && format(', C++{0}', matrix.cxx) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Release]
        extensions: ['ON', 'OFF']
        cxx: ['']   # default standard; the include entries below add C++20/23 jobs
        include:
          - os: ubuntu-latest
            config: Debug
            extensions: 'ON'
          # newer C++ standards (the libraries need C++17)
          - {os: ubuntu-latest, config: Release, extensions: 'ON', cxx: '20'}
          - {os: ubuntu-latest, config: Release, extensions: 'ON', cxx: '23'}
          - {os: macos-latest, config: Release, extensions: 'ON', cxx: '20'}
          - {os: macos-latest, config: Release, extensions: 'ON', cxx: '23'}
          - {os: windows-latest, config: Release, extensions: 'ON', cxx: '20'}
    steps:
      - uses: actions/checkout@v5
      - name: Deployment target (the runner's macOS)
        if: runner.os == 'macOS'
        run: .github/scripts/macos-deployment-target.sh
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libexpat1-dev
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        # expat for HostSupport, from the runner's vcpkg; CMake (>= 3.21) reads CMAKE_TOOLCHAIN_FILE from the environment
        shell: pwsh
        run: |
          vcpkg install expat:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DBUILD_EXAMPLE_PLUGINS=ON -DBUILD_EXAMPLE_HOSTS=${{ runner.os != 'Windows' && 'ON' || 'OFF' }}
          -DOFX_EXTENSIONS_NATRON=${{ matrix.extensions }} -DOFX_EXTENSIONS_NUKE=${{ matrix.extensions }}
          -DOFX_EXTENSIONS_VEGAS=${{ matrix.extensions }} -DOFX_EXTENSIONS_TUTTLE=${{ matrix.extensions }}
          -DOFX_EXTENSIONS_RESOLVE=${{ matrix.extensions }}
          -DPLUGIN_INSTALLDIR="$PWD/install/OFX/Plugins"
          ${{ matrix.cxx && format('-DCMAKE_CXX_STANDARD={0} -DCMAKE_CXX_STANDARD_REQUIRED=ON', matrix.cxx) || '' }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Install
        # PLUGIN_INSTALLDIR defaults to the system OFX folder; keep everything in the prefix here
        run: cmake --install build --config ${{ matrix.config }} --prefix install
      - name: Load the plug-ins with cacheDemo
        if: runner.os != 'Windows'
        run: |
          demo=$(find build -type f -name cacheDemo -perm -u+x | head -1)
          test -n "$demo"
          OFX_PLUGIN_PATH="$PWD/build/Plugins" "$demo" > cachedemo.log 2>&1 || { cat cachedemo.log; exit 1; }
          grep -c "Contexts:" cachedemo.log
          test "$(grep -c "Contexts:" cachedemo.log)" -ge 5

  make-linux:
    name: Linux weekly (Makefiles)
    # The Makefile builds (still used by Natron's build-plugins.sh until it switches to CMake,
    # Natron#1181), with the hostDemo checks; the per-PR builds use CMake (build.yml)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libexpat1-dev
      - name: Build and test
        run: .github/scripts/make-build-test.sh

  macos:
    name: macOS 15 arm64 weekly (Makefiles, Xcode clang, MacPorts)
    # The Makefile builds (still used by Natron's build-plugins.sh until it switches to CMake,
    # Natron#1181), with the hostDemo checks; the per-PR builds use CMake (build.yml)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install MacPorts
        # Support/include/osxDeploy.sh (release bundles) needs GNU sed: gsed from MacPorts
        uses: melusina-org/setup-macports@v1
        with:
          parameters: .github/macports.yaml
      - name: Remove Homebrew from PATH
        run: |
          echo "PATH=/opt/local/bin:/opt/local/sbin:$(echo "$PATH" | tr ':' '\n' | grep -v -e homebrew -e '^/usr/local/' | paste -sd: -)" >> "$GITHUB_ENV"
      - name: Deployment target (the runner's macOS)
        run: .github/scripts/macos-deployment-target.sh
      - name: Toolchain
        run: |
          echo "PATH=$PATH"
          ! command -v brew
          test "$(command -v c++)" = /usr/bin/c++
          c++ --version
          gsed --version | head -1
      - name: Build and test
        run: .github/scripts/make-build-test.sh

  macos-ofxh:
    name: macOS 15 arm64 weekly (the ofxh module from pip install, MacPorts Python 3.11)
    # The HostSupport Python bindings as a package (HostSupport/python/pyproject.toml,
    # scikit-build-core), built with MacPorts' nanobind and scikit-build-core, and their tests
    # against the sample plug-ins and hostDemo of a CMake build (same extension options),
    # with MacPorts' current nanobind, NumPy and scikit-build-core (pyproject.toml only bounds them).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install MacPorts
        uses: melusina-org/setup-macports@v1
        with:
          parameters: .github/macports-python.yaml
      - name: Remove Homebrew from PATH
        run: |
          echo "PATH=/opt/local/bin:/opt/local/sbin:$(echo "$PATH" | tr ':' '\n' | grep -v -e homebrew -e '^/usr/local/' | paste -sd: -)" >> "$GITHUB_ENV"
      - name: Deployment target (the runner's macOS)
        run: .github/scripts/macos-deployment-target.sh
      - name: Toolchain
        run: |
          ! command -v brew
          test "$(command -v c++)" = /usr/bin/c++
          python3.11 -c "import nanobind, scikit_build_core, numpy, pytest; print(nanobind.__version__, scikit_build_core.__version__, numpy.__version__)"
      - name: Build the sample plug-ins and hostDemo (CMake, the extensions off)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_EXAMPLE_PLUGINS=ON -DBUILD_EXAMPLE_HOSTS=ON \
            -DOFX_EXTENSIONS_NATRON=OFF -DOFX_EXTENSIONS_NUKE=OFF -DOFX_EXTENSIONS_VEGAS=OFF \
            -DOFX_EXTENSIONS_TUTTLE=OFF -DOFX_EXTENSIONS_RESOLVE=OFF
          cmake --build build --parallel
      - name: pip install ./HostSupport/python (the same options)
        run: |
          python3.11 -m venv --system-site-packages venv
          venv/bin/python -m pip install -v --no-build-isolation \
            -C cmake.define.OFX_EXTENSIONS_NATRON=OFF -C cmake.define.OFX_EXTENSIONS_NUKE=OFF \
            -C cmake.define.OFX_EXTENSIONS_VEGAS=OFF -C cmake.define.OFX_EXTENSIONS_TUTTLE=OFF \
            -C cmake.define.OFX_EXTENSIONS_RESOLVE=OFF ./HostSupport/python
          (cd /tmp && "$GITHUB_WORKSPACE/venv/bin/python" -c "import ofxh; print(ofxh.__file__, ofxh.build_config)")
      - name: ofxh tests (HostSupport/python/tests) against the installed module
        run: |
          export OFX_TEST_PLUGIN_PATH="$PWD/build/Plugins" \
            OFXHOST_HOSTDEMO="$(find "$PWD/build/HostSupport/examples" -name hostDemo -type f -perm -u+x | head -1)"
          venv/bin/python -m pytest -m "not opencl" HostSupport/python/tests
      - name: ofxhost tests on both backends (hostDemo, and in-process on the installed module)
        run: |
          export OFX_TEST_PLUGIN_PATH="$PWD/build/Plugins" \
            OFXHOST_HOSTDEMO="$(find "$PWD/build/HostSupport/examples" -name hostDemo -type f -perm -u+x | head -1)"
          venv/bin/python -m pytest -m "not opencl" HostSupport/examples/python/tests Support/Plugins/tests
