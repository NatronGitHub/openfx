name: Build

# Per push / pull request: exactly three full builds plus tests, one per OS
# (policy for all Natron-related repos). macOS runs after Linux and Windows pass, and isn't
# required for merging (macOS arm64 runners are scarce); extended.yml builds it weekly:
#   - Linux (ubuntu-24.04): CMake (.github/scripts/cmake-build-test.sh: build, install, the hostDemo
#     checks, a plug-in project built against the installed package, and a host project using
#     HostSupport with add_subdirectory and the system expat), plus the header (all together, and
#     each HostSupport and Support header on its own) and
#     property metadata checks and the Python tests (HostSupport/examples/python and
#     Support/Plugins/tests on both ofxhost backends, hostDemo and in-process, and the HostSupport
#     Python bindings, HostSupport/python/tests, with the extensions off and on)
#   - macOS 15 arm64: CMake, system (Xcode) clang, MacPorts tools and libomp, no Homebrew, and the
#     Python tests on the ofxh module (MacPorts' Python 3.11 and nanobind), as on Linux
#   - Windows: MSYS2 UCRT64, CMake, the plug-in and host projects, and the ofxh module (built and
#     imported, plus a smoke comparison of ofxhost.hostdemo with hostDemo: one describe and one render,
#     also in its batch mode, with a killed worker)
# The plug-in repositories build with CMake (Natron#1181), so the per-PR builds do too. Other
# variants (the Makefiles, C++20/23, MSVC, debug builds) are in extended.yml, which runs weekly
# and on demand.
#
# Frugal CI (NatronGitHub runners are shared by all repos): one run per change.
# Pushes run CI only on master and tags; feature branches run through their pull
# request (not on every push, and not twice). Draft pull requests don't run CI.
# Superseded runs are cancelled, except for tags. Jobs time out.

on:
  push:
    branches: [master]
    tags: ['*']
    paths-ignore: ['Documentation/**', '**.md']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['Documentation/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  linux:
    name: Linux (ubuntu-24.04, CMake)
    # no CI for draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/build.yml
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libexpat1-dev
          pip install pyyaml "nanobind>=2.0,<4" numpy pytest
      - name: Property metadata (@propdef)
        run: python scripts/check-props.py
      - name: Generated Python modules (ofxhost.constants, ofxhost.props) are up to date
        run: python scripts/gen-ofxhost-py.py --check
      - name: Generated property reference pages are up to date
        run: |
          python scripts/gen-props-doc.py
          git diff --exit-code -- Documentation/sources/Reference/ofxPropertiesReferenceGenerated.rst \
            Documentation/sources/Reference/ofxPropertySetsGenerated.rst \
            || { echo "::error::run scripts/gen-props-doc.py and commit the generated .rst files"; exit 1; }
      - name: All headers together compile (C++98, C++17; all extension flag sets)
        run: |
          { echo '#include "ofxCore.h"'; echo '#include "ofxImageEffect.h"'
            for h in $(cd include && ls *.h); do echo "#include \"$h\""; done
            echo '#include "nuke/fnOfxExtensions.h"'
            echo '#include "ofxhDrawSuiteOpenGL.h"'; } > all.cpp
          for std in c++98 c++17; do
            for D in "" "-DOFX_EXTENSIONS_RESOLVE" "-DOFX_EXTENSIONS_RESOLVE -DOFX_EXTENSIONS_NATRON -DOFX_EXTENSIONS_NUKE -DOFX_EXTENSIONS_VEGAS -DOFX_EXTENSIONS_TUTTLE -DOFX_SUPPORTS_OPENGLRENDER -DOFX_SUPPORTS_DIALOG -DOFX_SUPPORTS_PARAMETRIC_V2"; do
              echo "== $std $D"
              g++ -std=$std -fsyntax-only -Wall -Werror $D -Iinclude -IHostSupport/include all.cpp
            done
          done
      - name: Each HostSupport and Support header compiles on its own (C++98, C++17; no extensions, all of them)
        run: |
          # a host or a plug-in may include any of them first: each one includes what it uses (SF.11);
          # ofxsHWNDInteract.h needs <windows.h>
          hs_on="-DOFX_EXTENSIONS_RESOLVE -DOFX_EXTENSIONS_NATRON -DOFX_EXTENSIONS_NUKE -DOFX_EXTENSIONS_VEGAS -DOFX_EXTENSIONS_TUTTLE -DOFX_SUPPORTS_OPENGLRENDER -DOFX_SUPPORTS_DIALOG -DOFX_SUPPORTS_PARAMETRIC -DOFX_SUPPORTS_PARAMETRIC_V2 -DOFX_SUPPORTS_MULTITHREAD -DOFX_USE_STATIC_PLUGINS"
          s_on="-DOFX_EXTENSIONS_RESOLVE -DOFX_EXTENSIONS_NATRON -DOFX_EXTENSIONS_NUKE -DOFX_EXTENSIONS_VEGAS -DOFX_EXTENSIONS_TUTTLE -DOFX_SUPPORTS_OPENGLRENDER -DOFX_SUPPORTS_DIALOG -DOFX_SUPPORTS_PARAMETRIC_V2 -DOFX_USE_MULTITHREAD_MUTEX"
          for dir in HostSupport Support; do
            if [ $dir = HostSupport ]; then on=$hs_on; hdrs=$(cd HostSupport/include && ls ofxh*.h)
            else on=$s_on; hdrs=$(cd Support/include && ls ofxs*.h | grep -v ofxsHWNDInteract.h); fi
            for std in c++98 c++17; do
              for D in "" "$on"; do
                echo "== $dir $std $D"
                for h in $hdrs; do
                  printf '#include "%s"\n' "$h" | g++ -x c++ -std=$std -fsyntax-only -Wall -Werror $D -Iinclude -I$dir/include - \
                    || { echo "::error::$dir/include/$h does not compile on its own ($std $D)"; exit 1; }
                done
              done
            done
          done
      - name: Build and test
        # (with the HostSupport Python bindings, the ofxh module: nanobind from pip)
        env:
          OFX_CMAKE_EXTRA_ARGS: -DOFX_PYTHON_BINDINGS=ON -DPython_EXECUTABLE=${{ env.pythonLocation }}/bin/python
        run: .github/scripts/cmake-build-test.sh
      - name: The extensions on (Natron, Nuke, Vegas, TuttleOFX, Resolve) - DrawSuite self-tests and the ofxh tests
        run: |
          # cmake-build-test.sh builds with the extensions off: build and run the two DrawSuite
          # self-tests and the Support library self-test with OFX_EXTENSIONS_NATRON (no GL context
          # here: the property reading and the backend state, the drawing with the fake OpenGL
          # table, the native overlay decoding), and the ofxh module with the
          # plug-ins and hostDemo that its tests use, so that its code for the extensions compiles
          # and runs; and test_backends.py and test_hostdemo_cli.py, which compare the in-process
          # backend and its hostDemo command line with hostDemo there (two views per frame with Nuke
          # or Vegas; the other ofxhost tests expect one)
          set -eo pipefail
          cmake -S . -B build-ci-natron -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLE_PLUGINS=ON \
            -DBUILD_EXAMPLE_HOSTS=ON -DOFX_EXTENSIONS_NATRON=ON -DOFX_EXTENSIONS_NUKE=ON \
            -DOFX_EXTENSIONS_VEGAS=ON -DOFX_EXTENSIONS_TUTTLE=ON -DOFX_EXTENSIONS_RESOLVE=ON \
            -DOFX_PYTHON_BINDINGS=ON -DPython_EXECUTABLE="$pythonLocation/bin/python" > /dev/null
          cmake --build build-ci-natron --parallel 4 --target drawsuite-opengl-test drawcontext-opengl-test support-library-test ofxh \
            hostDemo suiteHandleChecks example-Basic-support example-ChoiceParams-support example-Generator-support \
            example-Invert-support example-Tester-support example-Retimer-support example-MultiBundle-support \
            example-Rectangle example-PropTester example-MultiplyGPU-support
          (cd build-ci-natron && Support/drawsuite-opengl-test && Support/drawcontext-opengl-test && Support/support-library-test)
          # the HostSupport checks with the extensions (e.g. kFnOfxImageEffectPropComponentsPresent per clip)
          SUITE_HANDLE_CHECKS_REQUIRE_PLUGIN=1 OFX_PLUGIN_PATH="$PWD/build-ci-natron/Plugins" \
            build-ci-natron/HostSupport/examples/suiteHandleChecks > suitehandlechecks-natron.log 2>&1 \
            || { cat suitehandlechecks-natron.log; exit 1; }
          # OFXH_REQUIRE=1: a missing module, plug-in or hostDemo fails the tests instead of skipping them
          PYTHONPATH="$PWD/build-ci-natron/HostSupport/python" OFXH_REQUIRE=1 \
            python -X faulthandler -m pytest -q -rs -p no:cacheprovider -o faulthandler_timeout=300 HostSupport/python/tests
          OFX_TEST_PLUGIN_PATH="$PWD/build-ci-natron/Plugins" PYTHONPATH="$PWD/build-ci-natron/HostSupport/python" \
            OFXHOST_HOSTDEMO="$PWD/build-ci-natron/HostSupport/examples/hostDemo" OFXH_REQUIRE=1 \
            python -X faulthandler -m pytest -q -rs -p no:cacheprovider -o faulthandler_timeout=300 \
            HostSupport/examples/python/tests/test_backends.py HostSupport/examples/python/tests/test_hostdemo_cli.py
      - name: Python wrapper and sample plug-in tests (ofxhost, on both backends)
        if: success() || failure()
        run: |
          # each render test runs with hostDemo and in-process on the ofxh module (OFXH_REQUIRE=1: a
          # backend that isn't built fails the tests instead of skipping them)
          OFX_TEST_PLUGIN_PATH="$PWD/build-ci/Plugins" PYTHONPATH="$PWD/build-ci/HostSupport/python" OFXH_REQUIRE=1 \
            OFXHOST_HOSTDEMO="$PWD/build-ci/HostSupport/examples/hostDemo" \
            python -X faulthandler -m pytest -q -rs -p no:cacheprovider -o faulthandler_timeout=300 HostSupport/examples/python/tests Support/Plugins/tests
      - name: HostSupport Python bindings tests (ofxh, HostSupport/python/tests)
        if: success() || failure()
        run: |
          # OFXH_REQUIRE=1: a missing module, plug-in or hostDemo fails the tests instead of skipping them
          export PYTHONPATH="$PWD/build-ci/HostSupport/python" OFXH_REQUIRE=1
          python -c "import ofxh; print(ofxh.__file__)"
          python -X faulthandler -m pytest -q -rs -p no:cacheprovider -o faulthandler_timeout=300 HostSupport/python/tests

  macos:
    name: macOS 15 arm64 (CMake, Xcode clang, MacPorts)
    # macOS arm64 runners are scarce: start only once Linux and Windows have passed. Merging only
    # requires Linux and Windows; macOS is also built weekly (extended.yml).
    needs: [linux, windows]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install MacPorts
        # Support/include/osxDeploy.sh (release bundles) needs GNU sed: gsed from MacPorts
        uses: melusina-org/setup-macports@v1
        with:
          # with Python 3.11, nanobind, NumPy and pytest, for the ofxh module
          parameters: .github/macports-python.yaml
      - name: Remove Homebrew from PATH
        run: |
          echo "PATH=/opt/local/bin:/opt/local/sbin:$(echo "$PATH" | tr ':' '\n' | grep -v -e homebrew -e '^/usr/local/' | paste -sd: -)" >> "$GITHUB_ENV"
      - name: Deployment target (the runner's macOS)
        # CI builds aren't shipped: they target the runner's macOS. The release bundles target
        # macOS 14.0 (VFX Reference Platform CY2027) and are built on a macOS 14 machine.
        # After the MacPorts install: the ports are MacPorts' binary archives for the runner's macOS.
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          echo "PATH=$PATH"
          ! command -v brew
          test "$(command -v c++)" = /usr/bin/c++
          c++ --version
          gsed --version | head -1
          test "$(command -v cmake)" = /opt/local/bin/cmake
          cmake --version | head -1
          ls /opt/local/lib/libomp/libomp.dylib
          python3.11 -c "import nanobind, numpy, pytest; print(nanobind.__version__, numpy.__version__)"
      - name: Build and test
        # (with the HostSupport Python bindings, the ofxh module: MacPorts' Python 3.11 and nanobind)
        env:
          OFX_CMAKE_EXTRA_ARGS: -DOFX_PYTHON_BINDINGS=ON -DPython_EXECUTABLE=/opt/local/bin/python3.11
        run: .github/scripts/cmake-build-test.sh
      - name: Python wrapper and sample plug-in tests (ofxhost, on both backends)
        if: success() || failure()
        run: |
          # OFXH_REQUIRE=1: a backend that isn't built fails the tests instead of skipping them
          OFX_TEST_PLUGIN_PATH="$PWD/build-ci/Plugins" PYTHONPATH="$PWD/build-ci/HostSupport/python" OFXH_REQUIRE=1 \
            OFXHOST_HOSTDEMO="$PWD/build-ci/HostSupport/examples/hostDemo" \
            python3.11 -X faulthandler -m pytest -q -rs -p no:cacheprovider -o faulthandler_timeout=300 \
            HostSupport/examples/python/tests Support/Plugins/tests
      - name: HostSupport Python bindings tests (ofxh, HostSupport/python/tests)
        if: success() || failure()
        run: |
          export PYTHONPATH="$PWD/build-ci/HostSupport/python" OFXH_REQUIRE=1
          python3.11 -c "import ofxh; print(ofxh.__file__)"
          python3.11 -X faulthandler -m pytest -q -rs -p no:cacheprovider -o faulthandler_timeout=300 HostSupport/python/tests

  windows:
    name: Windows (MSYS2 UCRT64, CMake)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-nanobind
      - name: Configure
        run: |
          set -eo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLE_PLUGINS=ON -DBUILD_EXAMPLE_HOSTS=ON \
            -DOFX_EXTENSIONS_NATRON=ON -DOFX_EXTENSIONS_NUKE=ON -DOFX_EXTENSIONS_VEGAS=ON \
            -DOFX_EXTENSIONS_TUTTLE=ON -DOFX_EXTENSIONS_RESOLVE=ON \
            -DPLUGIN_INSTALLDIR="$PWD/install/OFX/Plugins" \
            -DOFX_PYTHON_BINDINGS=ON -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF
          # strict -std=c++17 (C++ standard policy): no GNU dialect, so the compiler defines _WIN32 but not
          # WIN32, which is how plug-ins are built by the consumers
      - name: Build
        run: |
          set -eo pipefail
          cmake --build build --parallel
      - name: The ofxh module imports (HostSupport Python bindings, MSYS2 Python and nanobind)
        run: |
          set -eo pipefail
          # (only the imports, with ofxhost's in-process backend and the sample host; the next step
          # renders. The module's DLLs, expat and the GCC runtime, are next to MSYS2's python.exe)
          # (Windows paths: PYTHONPATH is read by the native python.exe)
          PYTHONPATH="$(cygpath -w "$PWD/build/HostSupport/python");$(cygpath -w "$PWD/HostSupport/examples/python")" \
            python -c "import ofxh, ofxhost.inprocess, ofxhost.graphhost, ofxhost.cli; print(ofxh.__file__, ofxh.build_config)"
      - name: Smoke run of hostDemo's command line in-process (ofxhost.hostdemo), against hostDemo
        run: |
          set -eo pipefail
          # one --describe and one small render of Invert, with hostDemo.exe and with
          # python -m ofxhost.hostdemo (and the hostdemo-inprocess script, which converts its path
          # for the native python.exe): the same exit status, describe JSON, files and crc32
          root=$PWD
          hd=$root/$(find build -name hostDemo.exe -type f | head -1)
          export OFX_PLUGIN_PATH="$(cygpath -w "$root/build/Plugins")"
          export PYTHONPATH="$(cygpath -w "$root/build/HostSupport/python")"
          args=(--no-std-paths --no-cache --quiet -p net.sf.openfx.invertPlugin -d float --frames 0
                --window 0,0,16,8 -i Source=ramp --format pfm -o out --report r.json)
          for h in hd py sh; do
            mkdir -p "smoke/$h" && cd "smoke/$h"
            case $h in
              hd) run=("$hd") ;;
              py) run=(python -m ofxhost.hostdemo) ;;
              sh) run=(env OFXHOST_PYTHON=python "$root/HostSupport/examples/python/hostdemo-inprocess") ;;
            esac
            [ $h = hd ] || export PYTHONPATH="$PYTHONPATH;$(cygpath -w "$root/HostSupport/examples/python")"
            "${run[@]}" --no-std-paths --no-cache --quiet -p net.sf.openfx.invertPlugin --describe d.json
            "${run[@]}" "${args[@]}"
            ls out.0*.pfm
            cd "$root"
          done
          # the batch mode: the same two runs in two workers, then a worker killed by the test hook
          # (the command is crashed, the worker replaced: the next command runs)
          mkdir -p smoke/bt && cd smoke/bt
          { echo "--no-std-paths --no-cache --quiet -p net.sf.openfx.invertPlugin --describe d.json"
            echo "${args[*]}"
            echo "--env OFXHOST_BATCH_TEST_HOOK=kill --no-std-paths --no-cache --quiet --describe k.json"
            echo "--no-std-paths --no-cache --quiet --describe k2.json"; } > cmds.txt
          st=0
          python -m ofxhost.hostdemo --batch cmds.txt -j 2 --batch-report recs.jsonl || st=$?
          test $st = 1
          cd "$root"
          python - <<'PY'
          import glob, json, os
          # the output files, byte for byte (MSYS2 has no cmp without diffutils)
          files = sorted(glob.glob("smoke/hd/out.0*.pfm"))
          assert files
          for h in ("py", "sh", "bt"):
              for f in files:
                  g = f"smoke/{h}/{os.path.basename(f)}"
                  assert open(f, "rb").read() == open(g, "rb").read(), g
          def load(p):
              return json.load(open(p), parse_constant=lambda c: (_ for _ in ()).throw(ValueError(c)))
          def nopath(d):  # plugin.filePath: as found by hostDemo, absolute in ofxh (a documented difference)
              if isinstance(d, dict):
                  return {k: nopath(v) for k, v in d.items() if k != "filePath"}
              return [nopath(v) for v in d] if isinstance(d, list) else d
          for h in ("py", "sh", "bt"):
              assert nopath(load(f"smoke/{h}/d.json")) == nopath(load("smoke/hd/d.json")), h
              crc = lambda p: [r["output"]["crc32"] for r in load(p)["renders"]]
              assert crc(f"smoke/{h}/r.json") == crc("smoke/hd/r.json"), h
          recs = [json.loads(x) for x in open("smoke/bt/recs.jsonl")]
          assert [(r["ok"], r["crashed"]) for r in recs] == [(True, False)] * 2 + [(False, True), (True, False)], recs
          assert "batch test hook: kill" in recs[2]["stdout"], recs[2]
          print("ofxhost.hostdemo: same as hostDemo (also --batch)")
          PY
      - name: Self-tests of the OpenGL DrawSuite core (a fake OpenGL table, __stdcall on Windows) and of the Support library
        run: |
          set -eo pipefail
          dst=$(find build -name drawsuite-opengl-test.exe -type f | head -1)
          test -n "$dst" || { echo "drawsuite-opengl-test was not built"; exit 1; }
          "$dst"
          # (extensions on: with the native overlay decoding)
          slt=$(find build -name support-library-test.exe -type f | head -1)
          test -n "$slt" || { echo "support-library-test was not built"; exit 1; }
          "$slt"
      - name: Install
        run: |
          set -eo pipefail
          cmake --install build --prefix install
          find install -name '*.ofx' | sort
          test "$(find install -name '*.ofx' | wc -l)" -ge 5
          # the example hosts are only compiled on Windows (the test renders run on Linux and macOS)
          ls install/bin/hostDemo.exe install/bin/cacheDemo.exe install/bin/propsetDump.exe install/bin/suiteHandleChecks.exe
      - name: Plug-in project built against the installed package and with add_subdirectory
        run: |
          set -eo pipefail
          CMAKE_GENERATOR=Ninja .github/scripts/cmake-plugin-project.sh "$PWD/install" "$PWD/plugin project"
      - name: Host project using HostSupport with add_subdirectory and the system expat
        run: |
          set -eo pipefail
          CMAKE_GENERATOR=Ninja .github/scripts/cmake-host-project.sh "$PWD/host project"
      - name: Every plug-in exports OfxGetPlugin
        run: |
          set -eo pipefail
          fail=0
          for f in $(find install -name '*.ofx'); do
            # no `objdump | grep -q` under pipefail: grep -q exits early and objdump may die of SIGPIPE
            if [ "$(objdump -p "$f" | grep -c 'OfxGetPlugin')" -gt 0 ]; then echo "ok: $f"; else echo "NO OfxGetPlugin export: $f"; fail=1; fi
          done
          exit $fail
