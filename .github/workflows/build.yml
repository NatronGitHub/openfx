name: Build

# Per push / pull request: one job per OS, with its tests (policy for all Natron-related repos;
# CMake, as the plug-in repositories, Natron#1181). The Linux job also builds a second, cheap tree
# with the extensions on, for the tests that need them. macOS runs after Linux and
# Windows pass, and isn't required for merging (macOS arm64 runners are scarce).
#   - Linux: the header and property metadata checks, cmake-build-test.sh, and the Python tests
#     (ofxhost on both backends, and the ofxh module) with the extensions off and on
#   - macOS 15 arm64: Xcode clang and MacPorts (no Homebrew), cmake-build-test.sh and the Python tests
#   - Windows: MSYS2 UCRT64 with the extensions on, the plug-in and host projects, the ofxh module
#     (imported, and windows-hostdemo-smoke.sh against hostDemo), the Support self-tests and
#     suiteHandleChecks
# The other variants (the Makefiles, C++20/23, MSVC, debug builds) are in extended.yml, which runs
# weekly and on demand.
#
# Frugal CI (NatronGitHub runners are shared by all repos): one run per change.
# Pushes run CI only on master and tags; feature branches run through their pull
# request (not on every push, and not twice). Draft pull requests don't run CI.
# Superseded runs are cancelled, except for tags. Jobs time out.

on:
  push:
    branches: [master]
    tags: ['*']
    paths-ignore: ['Documentation/**', '**.md']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['Documentation/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  # for every step: pytest reads PYTEST_ADDOPTS, and only the tests read OFXH_REQUIRE (1: a missing
  # ofxh module, plug-in or hostDemo fails the tests instead of skipping them)
  PYTEST_ADDOPTS: -q -rs -p no:cacheprovider -o faulthandler_timeout=300
  PYTHONFAULTHANDLER: '1'
  OFXH_REQUIRE: '1'
  # the extension macros of the header checks, and the CMake options of the extensions-on builds
  OFX_EXT_D: >-
    -DOFX_EXTENSIONS_RESOLVE -DOFX_EXTENSIONS_NATRON -DOFX_EXTENSIONS_NUKE -DOFX_EXTENSIONS_VEGAS
    -DOFX_EXTENSIONS_TUTTLE -DOFX_SUPPORTS_OPENGLRENDER -DOFX_SUPPORTS_DIALOG -DOFX_SUPPORTS_PARAMETRIC_V2
  OFX_EXT_CMAKE: >-
    -DOFX_EXTENSIONS_NATRON=ON -DOFX_EXTENSIONS_NUKE=ON -DOFX_EXTENSIONS_VEGAS=ON
    -DOFX_EXTENSIONS_TUTTLE=ON -DOFX_EXTENSIONS_RESOLVE=ON

jobs:
  linux:
    name: Linux (ubuntu-24.04, CMake)
    # no CI for draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/build.yml
      - name: Install dependencies
        run: |
          # (libegl1, libegl-mesa0, libgl1-mesa-dri: EGL and llvmpipe for openglRenderChecks;
          # libglx-mesa0 and xvfb: its GLX run; the OpenCL ICD loader and headers, and PoCL's CPU
          # device, for openclRenderChecks)
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libexpat1-dev libegl1 libegl-mesa0 libgl1-mesa-dri \
            libglx-mesa0 xvfb ocl-icd-libopencl1 ocl-icd-opencl-dev opencl-c-headers pocl-opencl-icd
          pip install pyyaml "nanobind>=2.0,<4" numpy pytest "ruff~=0.17.0"
      - name: Python lint (ruff, with the rules of HostSupport/python/pyproject.toml)
        run: |
          ruff check --config HostSupport/python/pyproject.toml \
            HostSupport/examples/python HostSupport/python Support/Plugins/tests \
            scripts/check-props.py scripts/ofx_fork_props.py scripts/audit-propsets.py scripts/gen-ofxhost-py.py
      - name: Property metadata (@propdef)
        run: python scripts/check-props.py
      - name: Generated Python module (ofxhost.constants) is up to date
        run: python scripts/gen-ofxhost-py.py --check
      - name: Generated property reference pages are up to date
        run: |
          python scripts/gen-props-doc.py
          git diff --exit-code -- Documentation/sources/Reference/ofxPropertiesReferenceGenerated.rst \
            Documentation/sources/Reference/ofxPropertySetsGenerated.rst \
            || { echo "::error::run scripts/gen-props-doc.py and commit the generated .rst files"; exit 1; }
      - name: All headers together compile (C++17, C++20; all extension flag sets)
        run: |
          { echo '#include "ofxCore.h"'; echo '#include "ofxImageEffect.h"'
            for h in $(cd include && ls *.h); do echo "#include \"$h\""; done
            echo '#include "nuke/fnOfxExtensions.h"'
            echo '#include "ofxhDrawSuiteOpenGL.h"'; } > all.cpp
          for std in c++17 c++20; do
            for D in "" "-DOFX_EXTENSIONS_RESOLVE" "$OFX_EXT_D"; do
              echo "== $std $D"
              g++ -std=$std -fsyntax-only -Wall -Werror $D -Iinclude -IHostSupport/include all.cpp
            done
          done
      - name: The C API headers compile as C (C99, C11; all extension flag sets)
        run: |
          # the OFX API headers are pure C (upstream CONTRIBUTING.md); the C++ helpers in include/
          # say so with '#error "... is C++"' and are left out
          { echo '#include "ofxCore.h"'; echo '#include "ofxImageEffect.h"'
            for h in $(cd include && grep -L '^#error ".* is C++"' *.h); do echo "#include \"$h\""; done
            echo '#include "nuke/fnOfxExtensions.h"'; echo '#include "nuke/camera.h"'
            echo '#include "tuttle/ofxReadWrite.h"'; } > all.c
          for std in c99 c11; do
            for D in "" "$OFX_EXT_D"; do
              echo "== $std $D"
              gcc -x c -std=$std -fsyntax-only -pedantic -Wall -Wstrict-prototypes -Werror $D -Iinclude all.c
            done
          done
      - name: Each HostSupport and Support header compiles on its own (C++17, C++20; no extensions, all of them)
        run: |
          # a host or a plug-in may include any of them first: each one includes what it uses (SF.11);
          # ofxsHWNDInteract.h needs <windows.h>. Plus the macros of each library: HostSupport's
          # OFX_SUPPORTS_PARAMETRIC, OFX_SUPPORTS_MULTITHREAD and OFX_USE_STATIC_PLUGINS, Support's
          # OFX_USE_MULTITHREAD_MUTEX
          hs_on="$OFX_EXT_D -DOFX_SUPPORTS_PARAMETRIC -DOFX_SUPPORTS_MULTITHREAD -DOFX_USE_STATIC_PLUGINS"
          s_on="$OFX_EXT_D -DOFX_USE_MULTITHREAD_MUTEX"
          for dir in HostSupport Support; do
            if [ $dir = HostSupport ]; then on=$hs_on; hdrs=$(cd HostSupport/include && ls ofxh*.h)
            else on=$s_on; hdrs=$(cd Support/include && ls ofxs*.h | grep -v ofxsHWNDInteract.h); fi
            for std in c++17 c++20; do
              for D in "" "$on"; do
                echo "== $dir $std $D"
                for h in $hdrs; do
                  printf '#include "%s"\n' "$h" | g++ -x c++ -std=$std -fsyntax-only -Wall -Werror $D -Iinclude -I$dir/include - \
                    || { echo "::error::$dir/include/$h does not compile on its own ($std $D)"; exit 1; }
                done
              done
            done
          done
      - name: Build and test
        # (with the HostSupport Python bindings, the ofxh module: nanobind from pip)
        env:
          OFX_CMAKE_EXTRA_ARGS: -DOFX_PYTHON_BINDINGS=ON -DPython_EXECUTABLE=${{ env.pythonLocation }}/bin/python
        run: .github/scripts/cmake-build-test.sh
      - name: The extensions on (Natron, Nuke, Vegas, TuttleOFX, Resolve) - DrawSuite self-tests and the Python tests
        run: |
          # cmake-build-test.sh builds with the extensions off: build everything with them on, and run
          # the two DrawSuite self-tests and the Support library self-test with OFX_EXTENSIONS_NATRON
          # (no GL context here: the property reading and the backend state, the drawing with the fake
          # OpenGL table, the native overlay decoding), and the Python tests: the ofxh module's, and
          # the ofxhost and sample plug-in tests on both backends (two views per frame with Nuke or
          # Vegas), so that the code for the extensions compiles and runs
          set -eo pipefail
          cmake -S . -B build-ci-natron -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLE_PLUGINS=ON \
            -DBUILD_EXAMPLE_HOSTS=ON -DOFX_HOSTSUPPORT_OPENGL=ON -DOFX_HOSTSUPPORT_OPENCL=ON $OFX_EXT_CMAKE \
            -DOFX_PYTHON_BINDINGS=ON -DPython_EXECUTABLE="$pythonLocation/bin/python" > /dev/null
          cmake --build build-ci-natron --parallel 4
          (cd build-ci-natron && Support/drawsuite-opengl-test && Support/drawcontext-opengl-test && Support/support-library-test)
          # openfx::HostSupportOpenGL with the Natron context data (EGL, Mesa llvmpipe; OFXH_REQUIRE=1)
          OFX_PLUGIN_PATH="$PWD/build-ci-natron/Plugins" build-ci-natron/HostSupport/examples/openglRenderChecks
          # the GLX backend, on an X server of its own (Xvfb, Mesa llvmpipe)
          OFXH_OPENGL_BACKENDS=glx OFX_PLUGIN_PATH="$PWD/build-ci-natron/Plugins" \
            xvfb-run -a build-ci-natron/HostSupport/examples/openglRenderChecks
          # the HostSupport checks with the extensions (e.g. kFnOfxImageEffectPropComponentsPresent)
          SUITE_HANDLE_CHECKS_REQUIRE_PLUGIN=1 OFX_PLUGIN_PATH="$PWD/build-ci-natron/Plugins" \
            build-ci-natron/HostSupport/examples/suiteHandleChecks > suitehandlechecks-natron.log 2>&1 \
            || { cat suitehandlechecks-natron.log; exit 1; }
          PYTHONPATH="$PWD/build-ci-natron/HostSupport/python" python -m pytest -m "not opencl" HostSupport/python/tests
          OFX_TEST_PLUGIN_PATH="$PWD/build-ci-natron/Plugins" PYTHONPATH="$PWD/build-ci-natron/HostSupport/python" \
            OFXHOST_HOSTDEMO="$PWD/build-ci-natron/HostSupport/examples/hostDemo" \
            python -m pytest -m "not opencl" HostSupport/examples/python/tests Support/Plugins/tests
          # the GPU tests of ofxh and of the command lines with GLX too (Xvfb, Mesa llvmpipe): ofxh's
          # renderers of OFXH_OPENGL_BACKENDS, and --gpu-renderers (which lists GLX after EGL there)
          OFXH_OPENGL_BACKENDS=glx PYTHONPATH="$PWD/build-ci-natron/HostSupport/python" \
            xvfb-run -a python -m pytest -m "not opencl" HostSupport/python/tests/test_opengl.py
          OFX_TEST_PLUGIN_PATH="$PWD/build-ci-natron/Plugins" PYTHONPATH="$PWD/build-ci-natron/HostSupport/python" \
            OFXHOST_HOSTDEMO="$PWD/build-ci-natron/HostSupport/examples/hostDemo" \
            xvfb-run -a python -m pytest -m "not opencl" HostSupport/examples/python/tests/test_hostdemo_cli.py -k gpu
      - name: openfx::HostSupportOpenCL on PoCL (openclRenderChecks and the opencl Python tests, OFXH_REQUIRE=1)
        run: |
          # GPUGain with its OpenCL kernels (OFX_SUPPORTS_OPENCLRENDER, linked to libOpenCL: a
          # separate tree, as the bundles of cmake-build-test.sh need only system libraries), and the
          # checks on PoCL's CPU device: devices and queues, the copies to OpenCL buffers and
          # images, and GPUGain's OpenCL renders
          set -eo pipefail
          cmake -S . -B build-ci-opencl -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLE_PLUGINS=ON \
            -DBUILD_EXAMPLE_HOSTS=ON -DOFX_SUPPORTS_OPENCLRENDER=ON -DOFX_HOSTSUPPORT_OPENCL=ON \
            -DOFX_EXTENSIONS_NATRON=OFF -DOFX_EXTENSIONS_NUKE=OFF -DOFX_EXTENSIONS_VEGAS=OFF \
            -DOFX_EXTENSIONS_TUTTLE=OFF -DOFX_EXTENSIONS_RESOLVE=OFF \
            -DOFX_PYTHON_BINDINGS=ON -DPython_EXECUTABLE="$pythonLocation/bin/python" > /dev/null
          cmake --build build-ci-opencl --parallel 4 --target example-GPUGain-support example-Invert-support \
            openclRenderChecks hostDemo ofxh
          OFX_PLUGIN_PATH="$PWD/build-ci-opencl/Plugins" build-ci-opencl/HostSupport/examples/openclRenderChecks
          # the Python host on PoCL (the tests marked opencl, which the other runs deselect): the ofxh
          # module's OpenCL renders, and hostDemo --gpu=opencl against the in-process backend
          PYTHONPATH="$PWD/build-ci-opencl/HostSupport/python" python -m pytest -m opencl HostSupport/python/tests
          OFX_TEST_PLUGIN_PATH="$PWD/build-ci-opencl/Plugins" PYTHONPATH="$PWD/build-ci-opencl/HostSupport/python" \
            OFXHOST_HOSTDEMO="$PWD/build-ci-opencl/HostSupport/examples/hostDemo" \
            python -m pytest -m opencl HostSupport/examples/python/tests/test_hostdemo_cli.py
      - name: Python wrapper and sample plug-in tests (ofxhost, on both backends)
        if: success() || failure()
        run: |
          # each render test runs with hostDemo and in-process on the ofxh module
          OFX_TEST_PLUGIN_PATH="$PWD/build-ci/Plugins" PYTHONPATH="$PWD/build-ci/HostSupport/python" \
            OFXHOST_HOSTDEMO="$PWD/build-ci/HostSupport/examples/hostDemo" \
            python -m pytest -m "not opencl" HostSupport/examples/python/tests Support/Plugins/tests
      - name: HostSupport Python bindings tests (ofxh, HostSupport/python/tests)
        if: success() || failure()
        run: |
          export PYTHONPATH="$PWD/build-ci/HostSupport/python"
          python -c "import ofxh; print(ofxh.__file__)"
          python -m pytest -m "not opencl" HostSupport/python/tests

  macos:
    name: macOS 15 arm64 (CMake, Xcode clang, MacPorts)
    # macOS arm64 runners are scarce: start only once Linux and Windows have passed. Merging only
    # requires Linux and Windows; macOS is also built weekly (extended.yml).
    needs: [linux, windows]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install MacPorts
        # Support/include/osxDeploy.sh (release bundles) needs GNU sed: gsed from MacPorts
        uses: melusina-org/setup-macports@v1
        with:
          # with Python 3.11, nanobind, NumPy and pytest, for the ofxh module
          parameters: .github/macports-python.yaml
      - name: Remove Homebrew from PATH
        run: |
          echo "PATH=/opt/local/bin:/opt/local/sbin:$(echo "$PATH" | tr ':' '\n' | grep -v -e homebrew -e '^/usr/local/' | paste -sd: -)" >> "$GITHUB_ENV"
      - name: Deployment target (the runner's macOS)
        run: .github/scripts/macos-deployment-target.sh
      - name: Toolchain
        run: |
          echo "PATH=$PATH"
          ! command -v brew
          test "$(command -v c++)" = /usr/bin/c++
          c++ --version
          gsed --version | head -1
          test "$(command -v cmake)" = /opt/local/bin/cmake
          cmake --version | head -1
          ls /opt/local/lib/libomp/libomp.dylib
          python3.11 -c "import nanobind, numpy, pytest; print(nanobind.__version__, numpy.__version__)"
      - name: Build and test
        # (with the HostSupport Python bindings, the ofxh module: MacPorts' Python 3.11 and nanobind)
        env:
          OFX_CMAKE_EXTRA_ARGS: -DOFX_PYTHON_BINDINGS=ON -DPython_EXECUTABLE=/opt/local/bin/python3.11
        run: .github/scripts/cmake-build-test.sh
      - name: Python wrapper and sample plug-in tests (ofxhost, on both backends)
        if: success() || failure()
        run: |
          OFX_TEST_PLUGIN_PATH="$PWD/build-ci/Plugins" PYTHONPATH="$PWD/build-ci/HostSupport/python" \
            OFXHOST_HOSTDEMO="$PWD/build-ci/HostSupport/examples/hostDemo" \
            python3.11 -m pytest -m "not opencl" HostSupport/examples/python/tests Support/Plugins/tests
      - name: HostSupport Python bindings tests (ofxh, HostSupport/python/tests)
        if: success() || failure()
        run: |
          export PYTHONPATH="$PWD/build-ci/HostSupport/python"
          python3.11 -c "import ofxh; print(ofxh.__file__)"
          python3.11 -m pytest -m "not opencl" HostSupport/python/tests

  windows:
    name: Windows (MSYS2 UCRT64, CMake)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-nanobind
            mingw-w64-ucrt-x86_64-mesa
      - name: Move Mesa's DLLs out of the MSYS2 bin folder (only openglRenderChecks loads them)
        run: |
          set -eo pipefail
          # (else python.exe, next to them, would load Mesa's opengl32.dll for every plug-in that
          # imports opengl32: only the OpenGL step below runs on Mesa)
          mesa="$(cygpath -u "$RUNNER_TEMP")/mesa"
          mkdir -p "$mesa"
          pacman -Qlq mingw-w64-ucrt-x86_64-mesa | grep -E '^/ucrt64/bin/[^/]+\.dll$' | while read -r f; do mv "$f" "$mesa/"; done
          ls "$mesa"
          test -f "$mesa/opengl32.dll"
      - name: Configure
        run: |
          set -eo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLE_PLUGINS=ON -DBUILD_EXAMPLE_HOSTS=ON -DOFX_HOSTSUPPORT_OPENGL=ON $OFX_EXT_CMAKE \
            -DOFX_HOSTSUPPORT_OPENCL=ON -DPLUGIN_INSTALLDIR="$PWD/install/OFX/Plugins" \
            -DOFX_PYTHON_BINDINGS=ON -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF
          # strict -std=c++17 (C++ standard policy): no GNU dialect, so the compiler defines _WIN32 but not
          # WIN32, which is how plug-ins are built by the consumers
      - name: Build
        run: |
          set -eo pipefail
          cmake --build build --parallel
      - name: The ofxh module imports (HostSupport Python bindings, MSYS2 Python and nanobind)
        run: |
          set -eo pipefail
          # (only the imports, with ofxhost's in-process backend and the sample host; the next step
          # renders. The module's DLLs, expat and the GCC runtime, are next to MSYS2's python.exe)
          # (Windows paths: PYTHONPATH is read by the native python.exe)
          PYTHONPATH="$(cygpath -w "$PWD/build/HostSupport/python");$(cygpath -w "$PWD/HostSupport/examples/python")" \
            python -c "import ofxh, ofxhost.inprocess, ofxhost.graphhost, ofxhost.cli; print(ofxh.__file__, ofxh.build_config)"
      - name: Smoke run of hostDemo's command line in-process (ofxhost.hostdemo), against hostDemo
        run: .github/scripts/windows-hostdemo-smoke.sh
      - name: Self-tests of the OpenGL DrawSuite core (a fake OpenGL table, __stdcall on Windows) and of the Support library
        run: |
          set -eo pipefail
          dst=$(find build -name drawsuite-opengl-test.exe -type f | head -1)
          test -n "$dst" || { echo "drawsuite-opengl-test was not built"; exit 1; }
          "$dst"
          # (extensions on: with the native overlay decoding)
          slt=$(find build -name support-library-test.exe -type f | head -1)
          test -n "$slt" || { echo "support-library-test was not built"; exit 1; }
          "$slt"
      - name: openfx::HostSupportOpenGL with WGL on Mesa llvmpipe (openglRenderChecks, OFXH_REQUIRE=1)
        run: |
          set -eo pipefail
          grc=$(find build -name openglRenderChecks.exe -type f | head -1)
          test -n "$grc" || { echo "openglRenderChecks was not built"; exit 1; }
          # the runner has no GPU, and System32's opengl32.dll is OpenGL 1.1 (GDI). A copy of the
          # program in Mesa's folder loads Mesa's opengl32.dll and libgallium_wgl.dll (the program's
          # folder comes first in the DLL search order; their dependencies are found in PATH), and the
          # plug-in's opengl32.dll import gets the same module. The other steps never load Mesa.
          mesa="$(cygpath -u "$RUNNER_TEMP")/mesa"
          cp "$grc" "$mesa/"
          GALLIUM_DRIVER=llvmpipe OFX_PLUGIN_PATH="$(cygpath -w "$PWD/build/Plugins")" "$mesa/openglRenderChecks.exe"
      - name: HostSupport checks (suiteHandleChecks), with the Windows plug-in search path
        run: |
          set -eo pipefail
          # as hostdemo-checks.sh on Linux and macOS, with the extensions on; also the Windows-only
          # getStdOFXPluginPath() and setPluginHostPath() (#324)
          shc=$(find build -name suiteHandleChecks.exe -type f | head -1)
          test -n "$shc" || { echo "suiteHandleChecks was not built"; exit 1; }
          SUITE_HANDLE_CHECKS_REQUIRE_PLUGIN=1 OFX_PLUGIN_PATH="$(cygpath -w "$PWD/build/Plugins")" \
            "$shc" > suitehandlechecks.log 2>&1 || { cat suitehandlechecks.log; exit 1; }
          tail -1 suitehandlechecks.log
      - name: Install
        run: |
          set -eo pipefail
          cmake --install build --prefix install
          find install -name '*.ofx' | sort
          test "$(find install -name '*.ofx' | wc -l)" -ge 5
          # the example hosts are installed (on Windows, hostDemo and suiteHandleChecks run above, from the build tree)
          ls install/bin/hostDemo.exe install/bin/cacheDemo.exe install/bin/propsetDump.exe install/bin/suiteHandleChecks.exe
      - name: Plug-in project built against the installed package and with add_subdirectory
        run: |
          set -eo pipefail
          CMAKE_GENERATOR=Ninja .github/scripts/cmake-plugin-project.sh "$PWD/install" "$PWD/plugin project"
      - name: Host project using HostSupport with add_subdirectory and the system expat
        run: |
          set -eo pipefail
          CMAKE_GENERATOR=Ninja .github/scripts/cmake-host-project.sh "$PWD/host project"
      - name: Every plug-in exports OfxGetPlugin
        run: |
          set -eo pipefail
          fail=0
          for f in $(find install -name '*.ofx'); do
            # no `objdump | grep -q` under pipefail: grep -q exits early and objdump may die of SIGPIPE
            if [ "$(objdump -p "$f" | grep -c 'OfxGetPlugin')" -gt 0 ]; then echo "ok: $f"; else echo "NO OfxGetPlugin export: $f"; fail=1; fi
          done
          exit $fail
