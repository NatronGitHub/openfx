name: Build

# Per push / pull request: exactly three full builds plus tests, one per OS
# (policy for all Natron-related repos). macOS runs after Linux and Windows pass, and isn't
# required for merging (macOS arm64 runners are scarce); extended.yml builds it nightly:
#   - Linux (ubuntu-24.04): CMake (.github/scripts/cmake-build-test.sh: build, install, the hostDemo
#     checks, a plug-in project built against the installed package, and a host project using
#     HostSupport with add_subdirectory and the system expat), plus the header and
#     property metadata checks and the Python tests (HostSupport/examples/python, Support/Plugins/tests)
#   - macOS 15 arm64: CMake, system (Xcode) clang, MacPorts tools and libomp, no Homebrew
#   - Windows: MSYS2 UCRT64, CMake, the plug-in and host projects
# The plug-in repositories build with CMake (Natron#1181), so the per-PR builds do too. Other
# variants (the Makefiles, C++20/23, MSVC, debug builds) are in extended.yml, which runs nightly
# and on demand.
#
# Frugal CI (NatronGitHub runners are shared by all repos): one run per change.
# Pushes run CI only on master and tags; feature branches run through their pull
# request (not on every push, and not twice). Draft pull requests don't run CI.
# Superseded runs are cancelled, except for tags. Jobs time out.

on:
  push:
    branches: [master]
    tags: ['*']
    paths-ignore: ['Documentation/**', '**.md']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['Documentation/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  linux:
    name: Linux (ubuntu-24.04, CMake)
    # no CI for draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/build.yml
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libexpat1-dev
          pip install pyyaml
      - name: Property metadata (@propdef)
        run: python scripts/check-props.py
      - name: Generated Python modules (ofxhost.constants, ofxhost.props) are up to date
        run: python scripts/gen-ofxhost-py.py --check
      - name: Generated property reference pages are up to date
        run: |
          python scripts/gen-props-doc.py
          git diff --exit-code -- Documentation/sources/Reference/ofxPropertiesReferenceGenerated.rst \
            Documentation/sources/Reference/ofxPropertySetsGenerated.rst \
            || { echo "::error::run scripts/gen-props-doc.py and commit the generated .rst files"; exit 1; }
      - name: All headers together compile (C++98, C++17; all extension flag sets)
        run: |
          { echo '#include "ofxCore.h"'; echo '#include "ofxImageEffect.h"'
            for h in $(cd include && ls *.h); do echo "#include \"$h\""; done
            echo '#include "nuke/fnOfxExtensions.h"'
            echo '#include "ofxhDrawSuiteOpenGL.h"'; } > all.cpp
          for std in c++98 c++17; do
            for D in "" "-DOFX_EXTENSIONS_RESOLVE" "-DOFX_EXTENSIONS_RESOLVE -DOFX_EXTENSIONS_NATRON -DOFX_EXTENSIONS_NUKE -DOFX_EXTENSIONS_VEGAS -DOFX_EXTENSIONS_TUTTLE -DOFX_SUPPORTS_OPENGLRENDER -DOFX_SUPPORTS_DIALOG -DOFX_SUPPORTS_PARAMETRIC_V2"; do
              echo "== $std $D"
              g++ -std=$std -fsyntax-only -Wall -Werror $D -Iinclude -IHostSupport/include all.cpp
            done
          done
      - name: Each HostSupport header compiles on its own (C++98, C++17; no extensions, all of them)
        run: |
          # a host may include any of them first: each one includes what it uses
          for std in c++98 c++17; do
            for D in "" "-DOFX_EXTENSIONS_RESOLVE -DOFX_EXTENSIONS_NATRON -DOFX_EXTENSIONS_NUKE -DOFX_EXTENSIONS_VEGAS -DOFX_EXTENSIONS_TUTTLE -DOFX_SUPPORTS_OPENGLRENDER -DOFX_SUPPORTS_DIALOG -DOFX_SUPPORTS_PARAMETRIC -DOFX_SUPPORTS_PARAMETRIC_V2"; do
              echo "== $std $D"
              for h in $(cd HostSupport/include && ls ofxh*.h); do
                printf '#include "%s"\n' "$h" | g++ -x c++ -std=$std -fsyntax-only -Wall -Werror $D -Iinclude -IHostSupport/include - \
                  || { echo "::error::HostSupport/include/$h does not compile on its own ($std $D)"; exit 1; }
              done
            done
          done
      - name: Build and test
        run: .github/scripts/cmake-build-test.sh
      - name: DrawSuite self-tests with the Natron extensions (the DrawSuite shadows property)
        run: |
          # cmake-build-test.sh builds with the extensions off: build and run only the two
          # DrawSuite self-tests with OFX_EXTENSIONS_NATRON (no GL context here: the property
          # reading and the backend state, and the drawing with the fake OpenGL table)
          set -eo pipefail
          cmake -S . -B build-ci-natron -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLE_PLUGINS=ON \
            -DBUILD_EXAMPLE_HOSTS=OFF -DOFX_EXTENSIONS_NATRON=ON -DOFX_EXTENSIONS_NUKE=ON > /dev/null
          cmake --build build-ci-natron --parallel 4 --target drawsuite-opengl-test drawcontext-opengl-test
          (cd build-ci-natron && Support/drawsuite-opengl-test && Support/drawcontext-opengl-test)
      - name: Python wrapper and sample plug-in tests (ofxhost)
        run: |
          pip install numpy pytest
          OFX_TEST_PLUGIN_PATH="$PWD/build-ci/Plugins" \
            python -m pytest -q -p no:cacheprovider HostSupport/examples/python/tests Support/Plugins/tests

  macos:
    name: macOS 15 arm64 (CMake, Xcode clang, MacPorts)
    # macOS arm64 runners are scarce: start only once Linux and Windows have passed. Merging only
    # requires Linux and Windows; macOS is also built nightly (extended.yml).
    needs: [linux, windows]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install MacPorts
        # Support/include/osxDeploy.sh (release bundles) needs GNU sed: gsed from MacPorts
        uses: melusina-org/setup-macports@v1
        with:
          parameters: .github/macports.yaml
      - name: Remove Homebrew from PATH
        run: |
          echo "PATH=/opt/local/bin:/opt/local/sbin:$(echo "$PATH" | tr ':' '\n' | grep -v -e homebrew -e '^/usr/local/' | paste -sd: -)" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          echo "PATH=$PATH"
          ! command -v brew
          test "$(command -v c++)" = /usr/bin/c++
          c++ --version
          gsed --version | head -1
          test "$(command -v cmake)" = /opt/local/bin/cmake
          cmake --version | head -1
          ls /opt/local/lib/libomp/libomp.dylib
      - name: Build and test
        run: .github/scripts/cmake-build-test.sh

  windows:
    name: Windows (MSYS2 UCRT64, CMake)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-expat
      - name: Configure
        run: |
          set -eo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLE_PLUGINS=ON -DBUILD_EXAMPLE_HOSTS=ON \
            -DOFX_EXTENSIONS_NATRON=ON -DOFX_EXTENSIONS_NUKE=ON -DOFX_EXTENSIONS_VEGAS=ON \
            -DOFX_EXTENSIONS_TUTTLE=ON -DOFX_EXTENSIONS_RESOLVE=ON \
            -DPLUGIN_INSTALLDIR="$PWD/install/OFX/Plugins" \
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF
          # strict -std=c++17 (C++ standard policy): no GNU dialect, so the compiler defines _WIN32 but not
          # WIN32, which is how plug-ins are built by the consumers
      - name: Build
        run: |
          set -eo pipefail
          cmake --build build --parallel
      - name: Self-test of the OpenGL DrawSuite core (a fake OpenGL table, __stdcall on Windows)
        run: |
          set -eo pipefail
          dst=$(find build -name drawsuite-opengl-test.exe -type f | head -1)
          test -n "$dst" || { echo "drawsuite-opengl-test was not built"; exit 1; }
          "$dst"
      - name: Install
        run: |
          set -eo pipefail
          cmake --install build --prefix install
          find install -name '*.ofx' | sort
          test "$(find install -name '*.ofx' | wc -l)" -ge 5
          # the example hosts are only compiled on Windows (the test renders run on Linux and macOS)
          ls install/bin/hostDemo.exe install/bin/cacheDemo.exe install/bin/propsetDump.exe install/bin/suiteHandleChecks.exe
      - name: Plug-in project built against the installed package and with add_subdirectory
        run: |
          set -eo pipefail
          CMAKE_GENERATOR=Ninja .github/scripts/cmake-plugin-project.sh "$PWD/install" "$PWD/plugin project"
      - name: Host project using HostSupport with add_subdirectory and the system expat
        run: |
          set -eo pipefail
          CMAKE_GENERATOR=Ninja .github/scripts/cmake-host-project.sh "$PWD/host project"
      - name: Every plug-in exports OfxGetPlugin
        run: |
          set -eo pipefail
          fail=0
          for f in $(find install -name '*.ofx'); do
            # no `objdump | grep -q` under pipefail: grep -q exits early and objdump may die of SIGPIPE
            if [ "$(objdump -p "$f" | grep -c 'OfxGetPlugin')" -gt 0 ]; then echo "ok: $f"; else echo "NO OfxGetPlugin export: $f"; fail=1; fi
          done
          exit $fail
